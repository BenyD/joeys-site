# Deploys to the client's Vercel account (Hobby) with their token.
# Hobby blocks git-triggered deploys of commits from non-members on private
# repos, so Vercel's own git integration is switched off in vercel.json and
# this workflow deploys instead.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_SCOPE: joevinaaldrin-6234
  VERCEL_PROJECT: joeys

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Link project
        run: npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull production settings and env
        run: npx --yes vercel@latest pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: npx --yes vercel@latest build --prod --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
